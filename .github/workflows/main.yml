name: Main Workflow

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Add any setup steps required for your environment here

      - name: Run createPhar.sh in Docker container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            php:7.0-cli \
            bash script/createPhar.sh

      # Add further steps if needed
